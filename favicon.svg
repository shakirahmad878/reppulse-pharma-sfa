<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14243B" />
      <stop offset="100%" stop-color="#09101D" />
    </linearGradient>
    <linearGradient id="neonPulse" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#18A6A6" />
      <stop offset="100%" stop-color="#00FFA3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#1E3A5F" stroke-width="2" />

  <!-- Outer Cross Outline -->
  <path d="M48 24 h32 a4 4 0 0 1 4 4 v20 h20 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-20 v20 a4 4 0 0 1 -4 4 h-32 a4 4 0 0 1 -4 -4 v-20 h-20 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4 h20 v-20 a4 4 0 0 1 4 -4 z"
        fill="none"
        stroke="url(#neonPulse)"
        stroke-width="5"
        stroke-linejoin="round"
        stroke-linecap="round"
        filter="url(#glow)" />

  <!-- Geolocation Pin in top arm -->
  <path d="M64 34 c-4.5 0 -8 3.5 -8 8 c0 5.5 8 13 8 13 s8 -7.5 8 -13 c0 -4.5 -3.5 -8 -8 -8 z"
        fill="url(#neonPulse)" />
  <circle cx="64" cy="42" r="2.8" fill="#09101D" />

  <!-- Pulse / ECG Waveform crossing the center -->
  <path d="M22 64 h30 l6 18 l8 -32 l7 20 l5 -6 h28"
        fill="none"
        stroke="url(#neonPulse)"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)" />
</svg>
