version: '3.8'

services:
  # 1. PostgreSQL with PostGIS Spatial Extension
  postgres-postgis:
    image: postgis/postgis:16-3.4
    container_name: sefmed-postgres-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pharma_secret_2026}
      POSTGRES_DB: ${DB_NAME:-sefmed_pharma_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sefmed_pharma_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Real-Time Telemetry Broker
  redis:
    image: redis:7-alpine
    container_name: sefmed-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]

  # 3. SefMed Backend API & Telemetry Ingestion Service
  backend-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sefmed-backend-api
    restart: unless-stopped
    depends_on:
      postgres-postgis:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-pharma_secret_2026}@postgres-postgis:5432/${DB_NAME:-sefmed_pharma_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-pharma_enterprise_jwt_super_secret_key_2026}
      JWT_EXPIRY: "7d"
    ports:
      - "5000:5000"

  # 4. Web Admin & Management Portal (Nginx Reverse Proxy)
  web-admin:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: sefmed-web-admin
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend-api

volumes:
  pgdata:
  redisdata:
